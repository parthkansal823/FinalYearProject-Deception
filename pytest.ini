[pytest]
testpaths = tests
addopts = -q --strict-markers
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning:pytest_asyncio.*
markers =
    invisibility: bait invisibility-gate checks (spec §6.7, NFR-01)
    consistency: decoy contradiction checks (spec §6.9, NFR-09)
