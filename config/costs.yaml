# =============================================================================
#  FROZEN COST TABLE  —  Phase 0 artefact  (spec §6.5, §7.3, §13 Phase 0)
# =============================================================================
#
#   *** DO NOT EDIT THESE NUMBERS AFTER DATA COLLECTION HAS BEGUN. ***
#
#  The decision thresholds of this system are DERIVED from this table, not
#  tuned by trial and error. That derivation is only meaningful if the table
#  is fixed in advance. Adjusting these values after seeing results
#  invalidates every baseline comparison in the evaluation (spec §6.5, §16).
#
#  `integrity_sha256` is a hash over the `matrix` and `fusion` blocks below.
#  adf.config verifies it on every load and refuses to start on a mismatch.
#  Regenerating it is a deliberate act: `python -m adf.config --refreeze`,
#  which records the change in config/costs.CHANGELOG.md.
# =============================================================================

schema_version: 1
frozen: true
frozen_on: "2026-08-13"
frozen_before: "any traffic generation (Phase 1) or attack round 1 (Phase 2)"
integrity_sha256: "45ceb0e8c5915583342f67e9e1ae20815e805e47f51516b6ad2780050a0c2e57"

# -----------------------------------------------------------------------------
# Cost matrix: relative cost of taking `action` when the session's true nature
# is `true_class`. Units are arbitrary but internally consistent; only ratios
# matter. Negative = a desirable outcome.
# -----------------------------------------------------------------------------
matrix:
  benign:
    # Correct behaviour. This is the reference point, so it anchors at zero.
    pass: 0.0

    # "Wasted bait": a normal user received bait and, as designed, never
    # noticed it. Spec §6.5 calls this near-zero. It is not set to exactly
    # zero because that would assert the invisibility gate (NFR-01) is
    # perfect; this small residual prices the risk that a defective bait
    # escapes the gate. Keeping it non-zero also stops the policy from
    # baiting purely as a free action.
    bait: 1.0

    # A real user sent into the fake site. Spec §6.5: "the outcome that must
    # almost never occur"; NFR-05 targets effectively zero. Priced 200x a
    # wasted bait so the policy demands overwhelming evidence before diverting.
    divert: 200.0

  attack:
    # Missed attacker: reached the real application unimpeded and unobserved.
    pass: 25.0

    # Attacker was baited. The request STILL reaches the real application,
    # so the immediate exposure is identical to `pass` — and that is exactly
    # what this number now says.
    #
    # It was 8.0 in the first freeze, following spec §6.5's instruction to
    # discount it "to reflect that purchased information". That discount was
    # double counting: the value of the purchased information is computed
    # explicitly by adf.policy.voi (EVSI) and subtracted at decision time. A
    # cost table that also pre-discounts would count the same benefit twice
    # and would make the bait band an artefact of an arbitrary constant
    # rather than a derived result.
    #
    # Baiting an attacker therefore costs exactly what passing them costs.
    # Bait wins on information value alone, or it does not win.
    bait: 25.0

    # The win: attacker contained in the decoy, learns nothing real, and
    # generates threat intelligence. Negative cost per spec §6.5.
    divert: -20.0

# -----------------------------------------------------------------------------
# Score fusion: how the two suspicion scores become the single hostility
# probability p that the expected-cost calculation needs.
#
# The meter maintains two scores (spec §6.4): `automation` (is this a script?)
# and `malice` (is this hostile?). Cost is driven by hostility alone — a
# price-comparison bot is fully automated and entirely harmless — so the
# default fusion uses malice only, and the automation score is spent on
# BAIT SELECTION instead (spec §6.6, matching bait to attacker type).
#
# w_automation is left at 0.0 by default and may be fitted in Phase 3 IF the
# calibration data supports it. Any non-zero value must be reported.
# -----------------------------------------------------------------------------
fusion:
  method: "logit_linear"      # p = sigmoid(bias + w_m*logit(malice) + w_a*logit(automation))
  bias: 0.0
  w_malice: 1.0
  w_automation: 0.0
  epsilon: 1.0e-6             # logit clamp, keeps p strictly inside (0, 1)

# -----------------------------------------------------------------------------
# Derived (informational only — computed at load time, never read from here).
#
# IMMEDIATE expected costs:
#   E[pass]   = 25p
#   E[bait]   = 1(1-p) + 25p    = 1 + 24p        (same exposure as pass,
#                                                 plus the benign nuisance)
#   E[divert] = 200(1-p) - 20p  = 200 - 220p
#
# On immediate cost alone, BAIT is never optimal: it costs exactly (1-p) more
# than PASS at every belief. That is the correct and honest position — bait
# has no immediate benefit whatsoever.
#
# The decision uses EFFECTIVE cost, which subtracts the expected value of the
# information the bait buys (adf/policy/voi.py):
#
#   effective(bait) = 1 + 24p - V(p)
#
# so BAIT is chosen exactly when  V(p) > 1 - p : when the information is
# worth more than the residual invisibility risk borne by the benign mass.
#
# The resulting band therefore depends on measured bait effectiveness and is
# NOT recorded here. Print it with `python -m adf.policy`. This is a stronger
# claim than the first freeze allowed: the bait band is an empirical
# consequence, not a constant.
# -----------------------------------------------------------------------------
notes:
  bait_band: "derived at runtime from the cost matrix and calibrated bait effectiveness"
